name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test --timeout 5000
      - run: bun run build
      - run: bun run release:check "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Publish release assets
        run: gh release create "$RELEASE_VERSION" dist/main.js dist/manifest.json dist/styles.css --verify-tag --title "$RELEASE_VERSION" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
